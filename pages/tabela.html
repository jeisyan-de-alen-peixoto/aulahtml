<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela HTML</title>
    <style>
      table,
      tr,
      th,
      td {
        border: 1px solid;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <table>
      <!-- cabeçalho -->
      <thead>
        <tr>
          <!-- 1ª linha -->
          <th colspan="3">Usuários</th>
        </tr>
        <!-- 2ª linha -->
        <tr>
          <!-- 3 colunas -->
          <th>id</th>
          <th>Foto</th>
          <th>nome</th>
          <th>telefone</th>
        </tr>
      </thead>
      <tbody>
        <!-- 3ª linha -->
        <tr>
          <td>1</td>
          <td><img width="30" src="https://conteudo.imguol.com.br/blogs/174/files/2018/05/iStock-648229868.jpg"</td>
          <td>JEISY</td>
          <td>85986101192</td>
        </tr>
        <tr>
            <td>2</td>
            <td><img width="30" src="https://conteudo.imguol.com.br/blogs/174/files/2018/05/iStock-648229868.jpg"</td>
            <td>Natan</td>
            <td>8598878999</td>
        </tr>
      </tbody>
    </table>

    
    </tbody>
  </table>
    <br>
    <hr> 


<!-- Exercicío-->

  <table>
    <thead>
        <tr>
            <th>Frutas</th>
            <th>Verduras</th>
            <th>Grão</th>
            <th>...</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Maça</td>
            <td>Alface</td>
            <td>Arroz</td>
            <td rowspan="3">3 linhas</td>
        </tr>
        <tr>
            <td>laranja</td>
            <td>beterraba</td>
            <td>trigo</td>
        </tr>
        <tr>
            <td>3 colunas</td>
        </tr>
    </tbody>
  </table>
   
  </body>
</html>
